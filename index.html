<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prywatne AI z dostępem do Sieci</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .config-box { background: #252538; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #45475a; }
        input, button, select { background: #313244; color: #cdd6f4; border: 1px solid #45475a; padding: 10px; border-radius: 6px; margin: 5px 0; font-size: 14px; }
        button { background: #a6e3a1; color: #11111b; cursor: pointer; font-weight: bold; }
        button:hover { background: #94e2d5; }
        #chat-window { flex-grow: 1; background: #252538; border-radius: 8px; border: 1px solid #45475a; padding: 15px; overflow-y: auto; margin-bottom: 15px; }
        .msg { margin-bottom: 12px; padding: 10px; border-radius: 6px; max-width: 80%; line-height: 1.4; white-space: pre-wrap; }
        .user { background: #313244; margin-left: auto; text-align: right; border-right: 4px solid #89b4fa; }
        .ai { background: #45475a; margin-right: auto; border-left: 4px solid #a6e3a1; }
        .system { background: #f38ba8; color: #11111b; margin: auto; text-align: center; font-size: 13px; font-weight: bold; }
        .info { background: #fab387; color: #11111b; margin: auto; text-align: center; font-size: 12px; }
        .input-area { display: flex; gap: 10px; }
        #user-input { flex-grow: 1; }
    </style>
</head>
<body>

    <div class="config-box">
        <h3>🌐 Konfiguracja AI z Dostępem do Sieci</h3>
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
            <div>
                <label>1. Wklej swój klucz API z OpenRouter.ai:</label><br>
                <input type="password" id="api-key" placeholder="Klucz sk-or-..." style="width: 95%;">
            </div>
            <div>
                <label>2. Wybierz Tryb Pracy AI:</label><br>
                <select id="model-select" style="width: 100%;">
                    <option value="google/gemini-2.5-flash">🌐 Gemini 2.5 Flash (Pełny Internet)</option>
                    <option value="google/gemma-2-9b-it:free">⚡ Gemma 2 (Darmowy czat, bez sieci)</option>
                </select>
            </div>
        </div>
    </div>

    <div id="chat-window">
        <div class="msg ai">🤖 AI: Cześć! Uruchomiłeś projekt przez GitHub Pages. Wklej klucz API u góry, wybierz model z dostępem do internetu i przetestuj mnie!</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Zadaj pytanie (np. Jaka jest dzisiaj pogoda w Warszawie?)..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Wyślij 🚀</button>
    </div>

    <script>
        // Pamięć podręczna rozmowy, by AI pamiętało kontekst chatowania
        let conversationHistory = [
            { role: "system", content: "Jesteś zaawansowanym asystentem AI posiadającym pełny, 100% dostęp do internetu na żywo. Odpowiadasz po polsku. Jeśli użytkownik pyta o aktualne wydarzenia, pogodę lub fakty wymagające weryfikacji, przeszukujesz sieć i podajesz najnowsze dane z 2026 roku." }
        ];

        function appendMessage(sender, text) {
            const chatWindow = document.getElementById('chat-window');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerText = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage() {
            const apiKey = document.getElementById('api-key').value.trim();
            const userInput = document.getElementById('user-input').value.trim();
            const selectedModel = document.getElementById('model-select').value;
            
            if (!apiKey) {
                alert("Proszę podać klucz API z OpenRouter!");
                return;
            }
            if (!userInput) return;

            // Wyświetlenie wiadomości użytkownika
            appendMessage('user', `Ty: ${userInput}`);
            document.getElementById('user-input').value = "";
            
            // Dodanie do historii wysyłanej do API
            conversationHistory.push({ role: "user", content: userInput });

            try {
                appendMessage('info', "🔍 AI łączy się z siecią i generuje odpowiedź...");

                const response = await fetch("https://openrouter.ai", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href, // Wymagane przez OpenRouter na hostingu
                        "X-Title": "Prywatne GitHub AI"
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: conversationHistory
                    })
                });

                // Usuwamy komunikat o ładowaniu
                const infos = document.getElementsByClassName('info');
                if(infos.length > 0) infos[infos.length - 1].remove();

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    appendMessage('ai', `🤖 AI: ${aiReply}`);
                    conversationHistory.push({ role: "assistant", content: aiReply });
                } else {
                    appendMessage('system', `❌ Błąd API: ${JSON.stringify(data.error ? data.error.message : data)}`);
                }

            } catch (error) {
                // Usuwamy komunikat o ładowaniu w przypadku błędu
                const infos = document.getElementsByClassName('info');
                if(infos.length > 0) infos[infos.length - 1].remove();
                
                appendMessage('system', `❌ Błąd połączenia: ${error.message}\nUpewnij się, że strona została w pełni uruchomiona przez https:// (GitHub Pages).`);
            }
        }
    </script>
</body>
</html>
